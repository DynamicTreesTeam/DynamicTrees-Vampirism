modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL="https://github.com/DynamicTreesTeam/DynamicTrees-Vampirism/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_authors}"
    credits = "${mod_credits}"
    description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
modId="dynamictrees"
type="required"
versionRange="[${dynamic_trees_version},)"
ordering="AFTER"
side="BOTH"


[[dependencies."${mod_id}"]]
modId="dtaddon_lib"
type="required"
versionRange="[0.2.0-BETA03,)"
ordering="AFTER"
side="BOTH"
